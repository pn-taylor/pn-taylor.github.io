site: For Pete's Sake

url: https://www.pntaylor.net
baseurl: 

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug
  projects:
    output: true
    permalink: /project/:slug
  reviews:
    output: true
    permalink: /review/:slug

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  -
    scope:
      path: ""
      type: "reviews"
    values:
      layout: "review"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  
sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
paginate: 6
# Reviews get their own feed at /feed/reviews.xml (the main feed is blog posts)
feed:
  collections:
    reviews:
      path: "/feed/reviews.xml"
# Used for link previews when pages are shared (see _layouts/default.html)
social:
  twitter: pntaylor
  fediverse: "@pntaylor@aus.social"
  default_image: /images/blog_images/me.jpg
paginate_path: "/blog/page:num/"
# set timezone
timezone: Australia/Canberra