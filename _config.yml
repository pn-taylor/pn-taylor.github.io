site: For Pete's Sake
# Shown on notes, and as the author in the feeds
author:
  name: Peter Taylor
  avatar: /images/blog_images/avatar.jpg

url: https://www.pntaylor.net
baseurl: 

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug
  projects:
    output: true
    permalink: /project/:slug
  reviews:
    output: true
    permalink: /review/:slug
  notes:
    output: true
    permalink: /note/:name

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  -
    scope:
      path: ""
      type: "reviews"
    values:
      layout: "review"
      featured_image: /images/demo/demo-portrait.jpg
  -
    scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
      featured_image: /images/demo/demo-landscape.jpg

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  
sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-redirect-from
paginate: 6
# Reviews and notes get their own feeds (the main feed is blog posts)
feed:
  collections:
    reviews:
      path: "/feed/reviews.xml"
    notes:
      path: "/feed/notes.xml"
# Used for link previews when pages are shared (see _layouts/default.html)
social:
  twitter: pntaylor
  fediverse: "@pntaylor@aus.social"
  default_image: /images/blog_images/me.jpg
paginate_path: "/blog/page:num/"
# set timezone
timezone: Australia/Canberra