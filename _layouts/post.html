---
layout: default
---

<section class="intro">

	<div class="wrap">

		<h1>{{ page.title }}</h1>
		<p>{{ page.date | date_to_long_string: "ordinal" }}</p>

	</div>

</section>

<section class="single">

	<div class="wrap">

		{{ page.content }}

		{% if page.tags.size > 0 %}
		<p class="post-tags">
			{% for tag in page.tags %}
			<a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>
			{% endfor %}
		</p>
		{% endif %}

		{% include post-nav.html back_url="/" back_label="All posts" %}

	</div>

</section>
